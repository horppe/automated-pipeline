version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: automated-pipeline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: automated_pipeline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: automated-pipeline-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: automated-pipeline-app
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/automated_pipeline?schema=public
      REDIS_URL: redis://redis:6379
    command: sh -c "npx prisma db push && npm run dev"

volumes:
  postgres_data:
  redis_data:
